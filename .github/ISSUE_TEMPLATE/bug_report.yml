name: Bug report
description: Report a reproducible engine or editor problem.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal project only if you have permission to share it.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, browser, GPU, Node version and relevant diagnostics.
    validations:
      required: true
